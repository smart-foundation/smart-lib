# The Smart Shell — the product. One binary, `smart`, hosting every domain
# command over the smart-lib engine, in-process.
#
# The corrected architecture (2026-10-13): the shell embedding a library of
# backends in-process is the CORRECT shape — the coupling that had to die was
# the god-trait and the stale schemas, not shell-uses-library. So this crate
# depends on the engine crate directly and speaks to it through the per-domain
# backend traits (here: `NetworkBackend`), exactly as the original shell
# embedded its engine through the backend trait object.
#
# Feature matrix: `domain-network` by default — the one domain whose engine
# is real and live-proven today. Every other domain is the migration queue
# (`smart migrate`), never a fake command.

[package]
name = "shell"
version = "0.1.0"
edition = "2021"
description = "The Smart Shell: one binary hosting every domain command over the smart-lib engine, in-process."
license = "MIT OR Apache-2.0"
publish = false

[[bin]]
name = "smart"
path = "src/main.rs"

[lib]
name = "shell"
path = "src/lib.rs"

[features]
# The Batch 4 wave landed all six of these on the engine in one commit, so the
# shell's default build hosts them all — the founder's live binary is one
# `cargo build -j6 -p shell` away. Each feature still gates its domain exactly
# like service: with it off the shell builds and the domain's commands answer
# honestly that the engine was built without the feature.
default = [
    "domain-network",
    "domain-clipboard",
    "domain-service",
    "domain-files",
    "domain-process",
    "domain-settings",
    "domain-logging",
    "domain-clock",
    "domain-time",
    "domain-audio",
    "domain-media",
    "domain-power",
    "domain-database",
    "domain-queue",
    "domain-appindex",
    "domain-manifest",
    "domain-vcard",
    "domain-content",
]
# The six Batch 4 domains, each a real engine half.
# files — the anchor: statx/getdents/inotify/copy_file_range/mmap + the CAS store
domain-files = ["smart-lib/domain-files"]
# process — /proc/<pid> read natively, the measured table
domain-process = ["smart-lib/domain-process"]
# settings — the host's own glib schema source + dconf, read live
domain-settings = ["smart-lib/domain-settings"]
# logging — the host's own svlogd dirs, /var/log, this process's stderr
domain-logging = ["smart-lib/domain-logging"]
# clock — the kernel's own clocks, timerfd timers, /proc/stat btime
domain-clock = ["smart-lib/domain-clock"]
# time — CLOCK_REALTIME, the host's TZif zone, the contract's calendar kernels
domain-time = ["smart-lib/domain-time"]
# Batch 5 domains
domain-audio = ["smart-lib/domain-audio"]
domain-media = ["smart-lib/domain-media"]
domain-power = ["smart-lib/domain-power"]
# The six Batch 6 domains, each a real engine half:
# database — the engine's own namespaced key/value store
domain-database = ["smart-lib/domain-database"]
# queue — the engine's own FIFO store
domain-queue = ["smart-lib/domain-queue"]
# appindex — the host's own freedesktop desktop-entry corpus
domain-appindex = ["smart-lib/domain-appindex"]
# manifest — the engine's own manifest store
domain-manifest = ["smart-lib/domain-manifest"]
# vcard — the engine's own RFC 6350 parser and formatter
domain-vcard = ["smart-lib/domain-vcard"]
# content — the engine's own content store
domain-content = ["smart-lib/domain-content"]
# The network domain's engine half. With it off the shell still builds (the
# engine crate compiles without the schema), but the network commands answer
# honestly that the engine was built without the domain.
domain-network = ["smart-lib/domain-network", "dep:qrcode", "dep:rqrr"]
# The clipboard domain's engine half — the native selection read/write path.
# With it off the shell still builds, but the clipboard commands answer honestly
# that the engine was built without the domain-clipboard feature.
domain-clipboard = ["smart-lib/domain-clipboard"]
# The service domain's engine half — the supervisor's own state read natively
# (runit's supervise tree here; systemd's system bus and openrc's state files on
# the hosts that run them). With it off the shell still builds, but the service
# commands answer honestly that the engine was built without the domain-service
# feature.
domain-service = ["smart-lib/domain-service"]

[dependencies]
# The engine, in-process. `default-features = false` keeps the zero-cost law:
# the shell enables std (it is a host application) plus exactly the domains
# its features name — never `--all-features` (charter law #11).
smart-lib = { path = "../..", default-features = false, features = ["std"] }
clap = { version = "4", features = ["derive"] }
rustyline = "14"
dirs = "5"
toml = "0.8"
atty = "0.2"
serde = { version = "1", features = ["derive"] }
# The terminal's own width table: East_Asian_Width + the emoji/zero-width
# classes, per Unicode release. This is the genuinely heavy half — data, not
# logic — and `console`/`tabled`/`ratatui` all measure with it, so the shell's
# cells measure the same columns the ecosystem's do. A hand-rolled range list
# went stale here (it drew `⛔` two columns, so a blocked radio's row outgrew
# its own border), and no range list written once stays right across releases.
# `width()` is the Western rule (Ambiguous = 1), `width_cjk()` the CJK rule
# (Ambiguous = 2); the renderer picks between them per locale
# (`widgets::ambiguous_width`). `no_std`, ~40 KiB.
unicode-width = "0.2"
# The QR codec behind `domain-network` — the founder's rule: crates for the
# heavy, ours for the small. `qrcode` ENCODES a payload into a module matrix
# (`network wifi share` renders it to the terminal so a phone can join by
# scanning the screen); `rqrr` DECODES a matrix back (the round-trip proof that
# the rendered output reads to the exact payload, and the image-path join).
# Both are optional and pulled only by the network domain, so a clipboard-only
# build pays nothing for a QR codec it never runs.
qrcode = { version = "0.14", optional = true }
rqrr = { version = "0.7", optional = true }
