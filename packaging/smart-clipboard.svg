<?xml version="1.0" encoding="UTF-8"?>
<!-- The product mark: a clipboard whose sheet is a stack of history rows.
     Monochrome by design (currentColor is not available in a plain SVG asset, so
     the fill is the app's signal colour) and legible at 16 px. -->
<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <rect x="8" y="8" width="48" height="48" rx="12" fill="#0b0d10"/>
  <rect x="10" y="10" width="44" height="44" rx="10" fill="none" stroke="#2b3342" stroke-width="1.5"/>
  <rect x="24" y="6" width="16" height="9" rx="3" fill="#7c8cff"/>
  <rect x="18" y="24" width="28" height="4" rx="2" fill="#e7eaf0"/>
  <rect x="18" y="33" width="22" height="4" rx="2" fill="#9aa3b2"/>
  <rect x="18" y="42" width="16" height="4" rx="2" fill="#6b7484"/>
</svg>
