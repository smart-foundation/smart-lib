name: ci

# What this workflow proves, in order of what could break a user:
#
#   1. the daemon builds and its clipboard/database tests pass  → a machine can
#      record a copy;
#   2. the contract client passes a round trip against a *real served backend*
#      → the app is talking to the contract, not to a mock of its own making;
#   3. the gpui product builds and its pure tests pass          → dropping it on
#      a desktop does not start with a compile error.
#
# The schemas are fetched at a pinned commit, never vendored: a schema change is a
# contract change and has to be a reviewed line in scripts/ci-fetch-schemas.sh.

on:
  push:
    branches: [master, 'arena/**']
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # The protocol tree the build compiles. Pinned; see scripts/ci-fetch-schemas.sh.
  PROTOCOL_REPO: https://github.com/smart-foundation/smart-protocol-official
  PROTOCOL_SHA: 9175b06bb7b2ddee87af4dd12aa02f07a4d3402f
  DAEMON_FEATURES: std,rpc,domain-clipboard,domain-database

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  daemon:
    name: engine · daemon + clipboard domain
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the capnp compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev
          capnp --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Fetch the contract's schema tree (pinned)
        run: ./scripts/ci-fetch-schemas.sh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: '. -> target'

      - name: Build the daemon
        env: { SMART_SCHEMA_DIR: ../smart-protocol-official/schema }
        run: ./scripts/ci-annotate.sh cargo build --bin smart-service --features "$DAEMON_FEATURES"

      - name: Daemon reports what it serves
        env: { SMART_SCHEMA_DIR: ../smart-protocol-official/schema }
        run: |
          # `--help` and `--print-address` are the daemon's whole CLI surface; if
          # either stops working, the installer and the unit file break.
          ./target/debug/smart-service --help > /dev/null
          ./target/debug/smart-service --version
          ./target/debug/smart-service --print-address --socket /tmp/smart-ci.sock \
            | grep -qx 'unix:///tmp/smart-ci.sock'

      - name: Clipboard, archive and database tests
        env: { SMART_SCHEMA_DIR: ../smart-protocol-official/schema }
        run: |
          ./scripts/ci-annotate.sh cargo test --lib --features "$DAEMON_FEATURES" -- clipboard
          ./scripts/ci-annotate.sh cargo test --lib --features "$DAEMON_FEATURES" -- database
          ./scripts/ci-annotate.sh cargo test --lib --features "$DAEMON_FEATURES" -- archive

      - name: The daemon actually binds and answers
        env: { SMART_SCHEMA_DIR: ../smart-protocol-official/schema }
        run: |
          # A real socket, a real accept loop, a real shutdown. `--no-watch` and
          # `--no-history` because a CI runner has no seat and no state dir worth
          # keeping; the daemon must still serve the contract in that shape.
          ./target/debug/smart-service --socket /tmp/smart-ci.sock --no-watch --no-history &
          DAEMON=$!
          for _ in $(seq 1 50); do
            [ -S /tmp/smart-ci.sock ] && break
            sleep 0.2
          done
          [ -S /tmp/smart-ci.sock ] || { echo "the daemon never bound its socket"; kill $DAEMON; exit 1; }
          kill $DAEMON
          wait $DAEMON 2>/dev/null || true

      - name: Clippy (advisory)
        continue-on-error: true
        env: { SMART_SCHEMA_DIR: ../smart-protocol-official/schema }
        run: cargo clippy --features "$DAEMON_FEATURES" --all-targets

  contract-client:
    name: proto · contract round trip
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the capnp compiler
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends capnproto libcapnp-dev
          capnp --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch the contract's schema tree (pinned)
        run: ./scripts/ci-fetch-schemas.sh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/smart-clipboard-proto -> target
            . -> target

      - name: Unit tests (config, errors, model)
        working-directory: crates/smart-clipboard-proto
        env: { SMART_SCHEMA_DIR: ../../../smart-protocol-official/schema }
        run: ../../scripts/ci-annotate.sh cargo test --lib

      - name: Contract round trip against a served backend
        working-directory: crates/smart-clipboard-proto
        env: { SMART_SCHEMA_DIR: ../../../smart-protocol-official/schema }
        run: ../../scripts/ci-annotate.sh cargo test --test contract_roundtrip -- --nocapture

  app:
    name: app · gpui product
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install the platform stack gpui needs
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            capnproto libcapnp-dev \
            libwayland-dev libxkbcommon-dev libx11-xcb-dev libvulkan-dev \
            libfontconfig-dev libfreetype-dev libssl-dev libclang-dev \
            pkg-config clang
          capnp --version

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Fetch the contract's schema tree (pinned)
        run: ./scripts/ci-fetch-schemas.sh

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            crates/smart-clipboard -> target
            crates/smart-clipboard-proto -> target

      - name: Build the app
        working-directory: crates/smart-clipboard
        env:
          SMART_SCHEMA_DIR: ../../../smart-protocol-official/schema
          # gpui links a Vulkan loader; a runner has no GPU, which is fine for a
          # build and for the pure tests below (nothing opens a window here).
          WGPU_BACKEND: vulkan
        run: ../../scripts/ci-annotate.sh cargo build

      - name: The app explains itself without a display
        working-directory: crates/smart-clipboard
        env: { SMART_SCHEMA_DIR: ../../../smart-protocol-official/schema }
        run: |
          # `--help` is the only path that must work with no seat and no service:
          # it is what a user runs first when the app does not start.
          ./target/debug/smart-clipboard --help | grep -q 'smart-clipboard'
          ./target/debug/smart-clipboard --version

      - name: Reducer, formatter and decoder tests
        working-directory: crates/smart-clipboard
        env: { SMART_SCHEMA_DIR: ../../../smart-protocol-official/schema }
        # These are the parts with no GPU in them: the store's command/event
        # reducer, the formatting helpers, the image decoder, the query grammar.
        run: ../../scripts/ci-annotate.sh cargo test --bin smart-clipboard

  hygiene:
    name: hygiene · formatting (advisory)
    runs-on: ubuntu-24.04
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: rustfmt
        run: cargo fmt --all -- --check
      - name: The engine still forbids shellouts
        run: |
          # Key principle #1: zero process spawns outside tests. The clipboard
          # domain replaces wl-paste/xclip, so this is the grep that proves it.
          if grep -rn 'Command::new' src/ | grep -v '^src/codegen/' ; then
            echo '::error::a shellout appeared outside the schema codegen'
            exit 1
          fi
