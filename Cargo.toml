domain-compositor = []
domain-console = []
domain-contacts = []
domain-content = []
domain-crypto = []
domain-database = []
domain-device = []
domain-diagnostics = []
domain-discovery = []
domain-display = []
domain-dns = []
domain-endpoint = []
domain-extension = []
domain-files = []
domain-font = []
domain-framebuffer = []
domain-gpu = []
domain-hal = []
domain-ime = []
domain-init = []
domain-input = []
domain-intent = []
domain-kernel = []
domain-key-management = []
domain-klog = []
domain-location = []
