# smart-lib — next generation: protocol-compliant backends for common OSes.
#
# Charter law #2 is the reason this manifest is shaped the way it is:
#
#   FEATURE = DOMAIN.  Exactly one cargo feature per contract schema, named
#   `domain-<schema-stem>`; build.rs derives the schema file from the feature
#   name, so adding a domain never edits build.rs and never edits src/lib.rs.
#
# Foundation (types.capnp, capability.capnp, abi.capnp + their imports) is
# NEVER feature-gated: it compiles in every configuration, including
# `--no-default-features`.
#
# The 86 domain features below are the complete set derived mechanically from
# the canonical tree: `ls /home/lufuno/smart/smart-protocol-official/schema` =
# 89 files, minus the 3 foundation files. (The charter and BRIEF-01 say "88
# domains"; the tree gives 86 — see knowledge/reports/06-all-features.md.)

[package]
name = "smart-lib"
version = "0.1.0"
edition = "2021"
description = "Protocol-compliant backends for common operating systems (no_std core, one backend trait per domain)."
license = "MIT OR Apache-2.0"
publish = false

[workspace]
resolver = "2"
# The convergence (C1): the Smart Shell comes home to the working stack — one
# new member crate producing the `smart` binary, depending on the engine
# in-process (the corrected architecture: the shell embeds its engine via the
# per-domain trait object, exactly as the original shell did).
members = ["crates/shell"]

[lib]
name = "smart_lib"
path = "src/lib.rs"

# The daemon serves the network contract, so it is built only when its
# features are on (charter law #2: you pay only for what you enable).
# Without this line the example's `#![cfg]` gate strips `main` and the
# non-default feature sets fail to compile the example target.
[[example]]
name = "smart-service"
required-features = [
  "rpc",
  "domain-network",
  "domain-discovery",
  "domain-files",
  "domain-process",
  "domain-settings",
  "domain-logging",
  "domain-clock",
  "domain-time",
  "std",
]

# The founder's privileged exact state read for the runit service cell (the
# physical limit: /run/runit/supervise.<name>/stat is root-only on this host,
# so the exact half of the state read is served by this binary run under
# `sudo`, while the library's /proc derivation serves every uid without it).
# A thin CLI over the engine's own RunitBackend::exact_states, so the tool
# cannot drift from what the backend reports.
[[example]]
name = "service-state-probe"
required-features = ["domain-service", "std"]

[[example]]
name = "network_probe"
required-features = ["domain-network", "std"]

[features]
# The default set is deliberately NOT "everything": charter law #2 exists to stop
# the old all-domains-at-once build. An application enables the domains it uses;
# `--all-features` is reserved for a build-graph integrity check.
default = ["std", "rpc", "domain-files", "domain-network", "domain-discovery", "domain-audio", "domain-system", "domain-process", "domain-settings", "domain-logging", "domain-clock", "domain-time"]

# ─── std ────────────────────────────────────────────────────────────────
# Opt-in widening only. The core stays no_std + alloc (law #1); `std` turns on
# capnp's std support (std error conversions, std I/O for serialize helpers)
# and is the seam where later waves hang host-only conveniences.
#
# Note: `std` also enables the host-socket transports today, because their
# gates still read `#[cfg(feature = "std")]`. `std-transports` below is the
# feature that exists to replace that reading.
std = ["capnp/std", "capnp/alloc"]

# ─── std-transports ─────────────────────────────────────────────────────
# Gate for the host-socket transports: `UnixSocket` and `Tcp` (law #4). Requested
# by the wave-3 report, `knowledge/reports/05-transport.md` §7.2, which notes
# that UnixSocket/Tcp currently gate on `std` — a feature that also widens capnp
# — so a consumer cannot take the sockets without the rest of std, or the rest
# of std without the sockets.
#
# It implies `std` **for now**, deliberately: their gates read
# `#[cfg(feature = "std")]`, and `src/transport/**` belongs to the wave-3 agent,
# so the skeleton agent cannot move them. With the implication in place the
# feature is usable today:
#
#     --features std-transports                                  # green
#     --no-default-features --features std-transports --features domain-files
#
# The decoupling step, when the wave-3 agent is ready (their four gate lines in
# `unix.rs`, `tcp.rs`, `mod.rs`, `channel.rs`), is two edits and no code change
# for consumers:
#
#   1. those gates become `#[cfg(feature = "std-transports")]`;
#   2. this line becomes `std-transports = ["capnp/std", "capnp/alloc"]` — the
#      socket transports need capnp's std serialize helpers — after which `std`
#      no longer pulls in UnixSocket/Tcp.
#
# `default` does not list it: default keeps `std`, which is what turns the
# sockets on today, so the default feature set is unchanged by adding this line.
std-transports = ["std"]

# ─── rpc ─────────────────────────────────────────────────────────────────
# The contract's own call model: capnp RPC, served over the transport's byte
# stream. This is the feature that turns the service harness on; it is
# `std`-only because `capnp-rpc` drives a futures executor and the socket
# transports need host sockets.
#
# `capnp-rpc` pulls `capnp` with its `std` feature (it is an std-only
# runtime), so the core's `no_std` law is honoured by *gating* the whole
# service layer here rather than by weakening capnp itself: a
# `--no-default-features` build never links the RPC runtime at all.
rpc = ["std", "dep:capnp-rpc", "dep:futures"]

# ─── domains: one line per schema ───────────────────────────────────────
# `domain-<stem>` compiles `<stem>.capnp` (dashes in the feature name are
# underscores in the file name, e.g. `domain-key-management` ->
# `key_management.capnp`). Transitive imports are pulled in automatically by
# build.rs. The hand-written half lives in src/domains/<stem>.rs and is
# registered by build.rs too, so a domain agent touches NO shared file.
#
# All 86 stems of the contract, alphabetical; the pilot four appear again in
# `default` above (a feature listed twice is a cargo error, so they are NOT
# repeated here).
domain-access = []
domain-accessibility = []
domain-ai = []
domain-app = []
domain-appindex = []
domain-archive = []
domain-audio = []
domain-auth = []
domain-backup = []
domain-biometric = []
domain-bluetooth = []
domain-boot = []
domain-buffer = []
domain-calendar = []
domain-camera = []
domain-capture = []
domain-cli = []
domain-clipboard = ["dep:x11rb", "dep:wayland-client", "dep:wayland-protocols-wlr"]
domain-clock = []
domain-compositor = []
domain-console = []
domain-contacts = []
domain-content = []
domain-crypto = []
domain-database = []
domain-device = []
domain-diagnostics = []
domain-discovery = []
domain-display = []
domain-dns = []
domain-endpoint = []
domain-extension = []
domain-files = []
domain-font = []
domain-framebuffer = []
domain-gpu = []
domain-hal = []
domain-ime = []
domain-init = []
domain-input = []
domain-intent = []
domain-kernel = []
domain-key-management = []
domain-klog = []
domain-location = []
domain-logging = []
domain-manifest = []
domain-media = ["dep:dbus"]
domain-module = []
domain-mount = []
domain-network = []
domain-nfc = []
domain-notification = []
domain-package = []
domain-power = ["dep:dbus"]
domain-print = []
domain-process = []
domain-queue = []
domain-runtime-search = []
domain-sandbox = []
domain-screenlock = []
domain-secret = []
domain-sensor = []
domain-service = ["dep:dbus"]
domain-session = []
domain-settings = ["dep:gio"]
domain-shell = []
domain-signal = []
domain-signature = []
domain-socket = []
domain-speech = []
domain-storage = []
domain-system = []
domain-system-search = []
domain-task-scheduler = []
domain-telephony = []
domain-theme = []
domain-time = []
domain-timezone = []
domain-translation = []
domain-tunnel = []
domain-update = []
domain-usb = []
domain-vcard = []
domain-web = []
domain-windowmanager = []

[dependencies]
# The runtime half of the capnp triad (capnp 0.27.x — the canonical contract's
# line). `default-features = false` + `alloc` keeps capnp itself no_std + alloc:
# `alloc` enables the capability/RPC traits the generated interfaces use
# (`FromClientHook`, `DynClientHook`). `std` is the separate widening feature
# above; it implies `alloc`.
capnp = { version = "0.27.2", default-features = false, features = ["alloc"] }

# The contract's own call model, served and called over the transports'
# byte streams. `capnp-rpc` IS the RPC protocol implementation (the vat
# network, the two-party connection, the capability export table); the
# generated `Server` traits from the contract's `interface` blocks are what
# it dispatches to. Both crates are already in the local registry, so the
# spine costs no new vendor.
capnp-rpc = { version = "0.27.0", optional = true }

# The futures runtime the RPC layer drives: the executor (one per served
# connection), the byte-stream pump's channels, and the `AsyncRead`/
# `AsyncWrite` traits `capnp-rpc` speaks. `executor` is what lets a
# connection be served on its own thread without a global runtime.
futures = { version = "0.3.34", default-features = false, features = [
    "std",
    "executor",
], optional = true }

# The Linux network domain's kernel-first read path (charter law #9), the
# maintained rust-netlink crate ecosystem: netlink-sys is the synchronous
# socket (no async runtime — this backend is synchronous), netlink-packet-core
# is the netlink framing, netlink-packet-route is the rtnetlink message
# vocabulary. rtnetlink itself was NOT used: its current line is async-only
# (its default features pull tokio), and a tokio runtime for one socket is the
# wrong trade for this backend. All three sit behind the mockable `NetlinkReader`
# seam in src/platforms/linux/netlink.rs; the core and the contract stay
# no_std + alloc.
netlink-packet-core = "0.9.0"
netlink-packet-route = "0.33.0"
netlink-sys = "0.9.0"

# The clipboard domain's native X11 read/write path (charter law #9): the
# maintained `x11rb` crate — a pure-Rust reimplementation of the X11 protocol,
# so the backend speaks the CLIPBOARD selection protocol directly and links no
# C library (libX11 / libxcb are not installed on the build box, so a C-backed
# client such as `x11`, `x11-dl` or `xcb` would fail to link here). It replaces
# the archive body's condemned `xclip` / `wl-paste` subprocess shellout with a
# real X client: no fork per op, no locale text parsing, no lost error codes.
# `optional = true` because the feature `domain-clipboard` turns it on, so a
# build that does not enable the clipboard domain never pays for it.
#
# The crate sits behind the mockable `SelectionHost` seam in
# `src/platforms/linux/clipboard.rs` (a scripted host in tests, the real X
# server in production), so no hermetic test touches a display.
x11rb = { version = "0.13.2", default-features = false, optional = true }

# The clipboard domain's native Wayland read/write path (charter law #9): the
# maintained `wayland-client` crate — a from-scratch Rust implementation of the
# Wayland wire protocol (no C libwayland, so it links on any box) — plus the
# generated `zwlr_data_control_unstable_v1` protocol from
# `wayland-protocols-wlr` (the standard freedesktop clipboard protocol wlroots
# compositors speak). It replaces the archive body's condemned
# `wl-paste`/`wl-copy` subprocess shellout with a real Wayland client: the
# registry global, the data-control device, the source/selection offers, the
# mime-type offers and the fd-passing read — the same "maintained crate
# ecosystem, native over subprocess, behind a mockable seam" standard the X11
# arm met with `x11rb`. Both are behind the mockable `SelectionHost` seam in
# `src/platforms/linux/clipboard.rs`; the arm is protocol-proven against a
# scripted compositor (a real wayland-server peer in the tests) even on a host
# with no compositor.
wayland-client = { version = "0.31", default-features = false, optional = true }
wayland-protocols-wlr = { version = "0.3", default-features = false, features = ["client"], optional = true }

# The service domain's native systemd read/write path (charter law #9): the
# maintained `dbus` crate — a from-scratch Rust reimplementation of the D-Bus
# client protocol (libdbus's wire format), no C library, so it links and runs
# on this build box. It replaces the archive body's `Command::new("systemctl")`
# fork-per-query shellout with the same native-D-Bus standard the network
# domain met with its hand-rolled NetworkManager marshaller: the manager's
# `ListUnits`/`ListUnitFiles`/`Properties.Get` for reads, `StartUnit`/
# `StopUnit`/`RestartUnit` for the (founder-run, gate-routed) control verbs.
# `optional = true` because the feature `domain-service` turns it on, so a
# build that does not enable the service domain never pays for it.
#
# The runit and openrc cells need no crate at all: their native paths are the
# supervisor's own files, read with std's fs API behind the `NativeSupervision`
# seam in src/platforms/linux/service/.
dbus = { version = "0.9", default-features = false, optional = true }
gio = { version = "0.21.5", default-features = false, features = ["v2_58"], optional = true }

# The service domain's hermetic control-path test proves the runit control
# write-through against a REAL fifo (the supervisor's control protocol is a
# fifo, and `std::os::unix::fs::mkfifo` is still unstable on this toolchain).
# libc is already in the graph through the network domain's netlink-sys, and
# it is dev-only here: a build of the library never links it.
[dev-dependencies]
libc = "0.2"
# The clipboard Wayland arm's scripted peer: a REAL wayland-server that speaks
# the wlr-data-control handshake to the engine's real wayland client, so the
# arm is proven over the wire without a compositor (charter law #8). Dev-only:
# a build of the library never links a Wayland server.
wayland-server = { version = "0.31", default-features = false }
wayland-protocols-wlr = { version = "0.3", default-features = false, features = ["server"] }

[build-dependencies]
# The codegen half of the triad (capnpc 0.27.0 — pure-Rust schema compiler that
# drives the system `capnp` binary).
capnpc = "0.27.0"
# The runtime half again, so build.rs can decode the very CodeGeneratorRequest
# it hands to capnpc and derive the feature-gated inventory in OUT_DIR (see
# `src/codegen/inventory.rs`). It is a build-time consumer of the pinned
# runtime, NOT a second codegen path: one artifact, one parser, the same one
# that produces the generated code under test.
capnp = { version = "0.27.2", default-features = false, features = ["alloc"] }
